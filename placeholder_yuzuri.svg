<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>ユズリ プレースホルダー</title>
  <defs>
    <linearGradient id="yzBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7BA68A" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2D5A3D" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="url(#yzBg)"/>
  <!-- subtle yuzu flowers floating in background -->
  <g opacity="0.5">
    <circle cx="100" cy="120" r="12" fill="#F4EFE2"/>
    <circle cx="100" cy="120" r="3" fill="#E8B83A"/>
    <circle cx="420" cy="160" r="10" fill="#F4EFE2"/>
    <circle cx="420" cy="160" r="2.5" fill="#E8B83A"/>
    <circle cx="80" cy="400" r="8" fill="#F4EFE2"/>
    <circle cx="80" cy="400" r="2" fill="#E8B83A"/>
  </g>
  <!-- dress (cedar leaf green) -->
  <path d="M180 480 L186 290 Q190 265 220 258 L292 258 Q322 265 326 290 L332 480 Z" fill="#7BA68A"/>
  <!-- dress collar (white yuzu flower trim) -->
  <path d="M212 258 L300 258 L292 282 L220 282 Z" fill="#F4EFE2"/>
  <!-- yuzu flower at center of collar -->
  <circle cx="256" cy="270" r="6" fill="#F4EFE2" stroke="#D6D3C4" stroke-width="1"/>
  <circle cx="256" cy="270" r="2" fill="#E8B83A"/>
  <!-- belt -->
  <rect x="186" y="340" width="140" height="6" fill="#2D5A3D"/>
  <!-- arms (holding notebook) -->
  <path d="M186 290 L160 380 L180 390 L210 320 Z" fill="#7BA68A"/>
  <path d="M326 290 L352 380 L332 390 L302 320 Z" fill="#7BA68A"/>
  <!-- notebook (cedar wood plank) -->
  <rect x="200" y="350" width="112" height="76" rx="4" fill="#8B6F4E" stroke="#5C4528" stroke-width="2"/>
  <line x1="220" y1="372" x2="290" y2="372" stroke="#F4EFE2" stroke-width="2" opacity="0.7"/>
  <line x1="220" y1="386" x2="290" y2="386" stroke="#F4EFE2" stroke-width="2" opacity="0.7"/>
  <line x1="220" y1="400" x2="278" y2="400" stroke="#F4EFE2" stroke-width="2" opacity="0.7"/>
  <!-- neck -->
  <rect x="244" y="220" width="24" height="42" fill="#F1D5B0"/>
  <!-- head (oval, calm) -->
  <ellipse cx="256" cy="190" rx="48" ry="56" fill="#F1D5B0"/>
  <!-- long hair flowing back -->
  <path d="M208 180 Q200 130 256 122 Q312 130 304 180 L308 250 L302 260 L210 260 L204 250 Z" fill="#3E3E3E"/>
  <!-- hair fringe -->
  <path d="M214 168 Q230 152 256 154 Q282 152 298 168 Q280 162 256 162 Q232 162 214 168 Z" fill="#3E3E3E"/>
  <!-- ribbon (yuzu yellow) -->
  <path d="M306 180 L320 178 L320 192 L306 190 Z" fill="#E8B83A"/>
  <!-- eyes (calm, almond) -->
  <ellipse cx="234" cy="198" rx="4" ry="5" fill="#1F3327"/>
  <ellipse cx="278" cy="198" rx="4" ry="5" fill="#1F3327"/>
  <!-- subtle eyebrows -->
  <path d="M224 184 L244 184" stroke="#3E3E3E" stroke-width="2" stroke-linecap="round"/>
  <path d="M268 184 L288 184" stroke="#3E3E3E" stroke-width="2" stroke-linecap="round"/>
  <!-- gentle smile -->
  <path d="M246 222 Q256 226 266 222" stroke="#1F3327" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- name label -->
  <rect x="160" y="450" width="192" height="34" rx="17" fill="#2D5A3D"/>
  <text x="256" y="473" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="18" fill="#F4EFE2" font-weight="700">ユズリ（仮）</text>
</svg>
