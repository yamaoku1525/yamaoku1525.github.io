<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>山の家アプリ ダウンロード</title>
<style>
  body{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
    background:#f5f7f4;color:#333;margin:0;padding:32px 18px;line-height:1.75;}
  main{max-width:460px;margin:0 auto;background:#fff;border-radius:16px;
    padding:26px 22px;box-shadow:0 8px 30px rgba(0,0,0,.08);}
  h1{font-size:20px;margin:0 0 10px;}
  .btn{display:block;text-align:center;background:#2e7d32;color:#fff;text-decoration:none;
    font-weight:700;padding:14px 16px;border-radius:10px;margin:18px 0;}
  .note{background:#f5f7f4;border-radius:10px;padding:12px 14px;font-size:14px;}
  code{background:#e6ebe4;padding:1px 5px;border-radius:4px;}
  .ios{color:#a3612a;}
  small{color:#888;}
</style>
</head>
<body>
<main>
  <h1>🏔 奥槍戸 山の家アプリ</h1>
  <p>Android向けの非公式アプリ（ベータ配布）です。</p>
  <a class="btn" href="./yamanoie.apk" download>▼ アプリをダウンロード（.apk）</a>
  <div class="note">
    <p><strong>インストール手順（Androidのみ）</strong></p>
    <ol>
      <li>上のボタンで <code>.apk</code> をダウンロード</li>
      <li>ファイルを開くと「提供元不明のアプリ」の確認が出ます</li>
      <li>設定 →「この提供元を許可」をオンに</li>
      <li>戻ってインストール → 開く</li>
    </ol>
    <p class="ios">※ iPhone / iPad には対応していません。</p>
  </div>
  <p><small>協同組合 阿波山雅 / 奥槍戸山の家　現在バージョン: v1.0.16</small></p>
</main>

</html>
