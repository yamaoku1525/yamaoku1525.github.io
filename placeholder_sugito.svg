<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>スギト プレースホルダー</title>
  <defs>
    <linearGradient id="stBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7BA68A" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2D5A3D" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="url(#stBg)"/>
  <!-- motion lines (sense of energy) -->
  <line x1="60" y1="200" x2="100" y2="200" stroke="#A4B8C0" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="60" y1="240" x2="110" y2="240" stroke="#A4B8C0" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="60" y1="280" x2="100" y2="280" stroke="#A4B8C0" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <!-- vest (tanned bark) with red heartwood inside -->
  <path d="M180 480 L184 290 Q190 268 220 260 L292 260 Q322 268 326 290 L334 480 Z" fill="#8B6F4E"/>
  <!-- inner red (heartwood) -->
  <path d="M222 280 L222 480 L292 480 L292 280 Z" fill="#A14B3A"/>
  <!-- vest opening -->
  <path d="M222 268 L222 480 L246 480 L256 280 L266 480 L292 480 L292 268 Z" fill="#A14B3A"/>
  <path d="M232 268 L256 268 L246 480 L240 480 Z" fill="#8B6F4E"/>
  <path d="M280 268 L256 268 L266 480 L272 480 Z" fill="#8B6F4E"/>
  <!-- arms (mid-stride pose) -->
  <path d="M186 290 L150 370 L172 380 L208 320 Z" fill="#8B6F4E"/>
  <path d="M326 290 L362 360 L340 372 L304 320 Z" fill="#8B6F4E"/>
  <!-- fist (right hand raised pumping) -->
  <circle cx="358" cy="356" r="14" fill="#E5C3A4"/>
  <!-- belt -->
  <rect x="186" y="346" width="148" height="8" fill="#5C4528"/>
  <!-- neck -->
  <rect x="244" y="222" width="24" height="42" fill="#E5C3A4"/>
  <!-- head -->
  <ellipse cx="256" cy="190" rx="48" ry="54" fill="#E5C3A4"/>
  <!-- hair (short messy) -->
  <path d="M212 175 Q210 138 256 130 Q302 138 300 175 Q288 154 256 152 Q224 154 212 175 Z" fill="#3E3E3E"/>
  <!-- the iconic single sprout standing up -->
  <line x1="256" y1="135" x2="256" y2="98" stroke="#7BA68A" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="248" cy="92" rx="6" ry="10" fill="#2D5A3D" transform="rotate(-30 248 92)"/>
  <ellipse cx="264" cy="92" rx="6" ry="10" fill="#2D5A3D" transform="rotate(30 264 92)"/>
  <!-- eyebrows (energetic, slanting up) -->
  <path d="M222 178 L244 174" stroke="#1F3327" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M268 174 L290 178" stroke="#1F3327" stroke-width="3.5" stroke-linecap="round"/>
  <!-- bright eager eyes -->
  <circle cx="234" cy="194" r="5" fill="#1F3327"/>
  <circle cx="278" cy="194" r="5" fill="#1F3327"/>
  <circle cx="236" cy="192" r="1.5" fill="#F4EFE2"/>
  <circle cx="280" cy="192" r="1.5" fill="#F4EFE2"/>
  <!-- big grin -->
  <path d="M236 218 Q256 232 276 218" stroke="#1F3327" stroke-width="3" fill="#A14B3A" stroke-linecap="round"/>
  <!-- blush (subtle) -->
  <ellipse cx="220" cy="210" rx="8" ry="4" fill="#E8B89A" opacity="0.7"/>
  <ellipse cx="292" cy="210" rx="8" ry="4" fill="#E8B89A" opacity="0.7"/>
  <!-- name label -->
  <rect x="160" y="450" width="192" height="34" rx="17" fill="#2D5A3D"/>
  <text x="256" y="473" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="18" fill="#F4EFE2" font-weight="700">スギト（仮）</text>
</svg>
