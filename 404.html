<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページが見つかりません｜協同組合 阿波山雅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="awasanga-styles.css">
<style>
.error-wrap { min-height: 70vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 80px 24px; }
.error-card { max-width: 640px; }
.error-num { font-size: clamp(72px, 12vw, 140px); font-weight: 700; color: var(--green-deep); line-height: 1; margin-bottom: 16px; letter-spacing: -0.02em; }
.error-title { font-size: clamp(20px, 3vw, 28px); color: var(--charcoal); font-weight: 700; margin-bottom: 16px; }
.error-text { font-size: 15px; line-height: 1.85; color: var(--gray); margin-bottom: 32px; }
.error-cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.char-img { width: 120px; margin: 0 auto 24px; }
</style>
<script src="common-nav.js" defer></script>
<script src="common-footer.js" defer></script>
</head>
<body>
<nav class="nav" aria-label="メインナビゲーション">
  <div class="nav-logo"><a href="index.html">協同組合 阿波山雅</a></div>
  <ul class="nav-links" data-common-nav data-current=""></ul>
</nav>
<main class="error-wrap">
  <div class="error-card">
    <div class="char-img"><img src="./img/奥槍どん.png" alt="奥槍どん"></div>
    <div class="error-num" aria-hidden="true">404</div>
    <h1 class="error-title">ページが見つかりません</h1>
    <p class="error-text">お探しのページが見つかりませんでした。<br>URLが変わったか、移動・削除された可能性があります。</p>
    <div class="error-cta">
      <a href="index.html" class="btn btn-primary">ホームへ戻る</a>
      <a href="support.html#unified-form" class="btn btn-outline">お問い合わせ</a>
    </div>
  </div>
</main>
<footer class="footer">
  <div class="footer-grid">
    <div class="footer-brand"><strong>協同組合 阿波山雅</strong>徳島・剣山系のふもとから、山と地域を次の世代へ。</div>
    <div><h5>サイト</h5><ul data-common-footer></ul></div>
  </div>
  <div class="footer-bottom">© 2026 協同組合 阿波山雅 All Rights Reserved.</div>
</footer>
</body>
</html>
